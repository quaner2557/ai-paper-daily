<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Paper Daily - 论文日历</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 40px;
        }

        .calendar-section {
            margin-bottom: 40px;
        }

        .calendar-section h2 {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }

        .calendar-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .calendar-controls button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .calendar-controls button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .calendar-controls button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .month-year {
            font-size: 1.3em;
            font-weight: 600;
            color: #333;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }

        .calendar-day-header {
            text-align: center;
            font-weight: 600;
            color: #666;
            padding: 10px;
            font-size: 0.9em;
        }

        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            border: 2px solid transparent;
        }

        .calendar-day:hover {
            background: #f0f0f0;
            transform: scale(1.05);
        }

        .calendar-day.has-papers {
            background: linear-gradient(135deg, #e8f4f8 0%, #f0e8f8 100%);
            border-color: #667eea;
        }

        .calendar-day.has-papers:hover {
            background: linear-gradient(135deg, #d0e8f0 0%, #e0d0f0 100%);
        }

        .calendar-day.empty {
            cursor: default;
            background: transparent;
        }

        .calendar-day.empty:hover {
            transform: none;
            background: transparent;
        }

        .calendar-day.today {
            border-color: #667eea;
            border-width: 3px;
        }

        .day-number {
            font-size: 1.1em;
            font-weight: 600;
            color: #333;
        }

        .paper-count {
            font-size: 0.75em;
            color: #667eea;
            margin-top: 2px;
            font-weight: 500;
        }

        .quick-links {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }

        .quick-link {
            display: block;
            padding: 15px 20px;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 10px;
            text-decoration: none;
            color: #333;
            transition: all 0.2s;
            border-left: 4px solid #667eea;
        }

        .quick-link:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .quick-link strong {
            display: block;
            font-size: 1.1em;
            margin-bottom: 5px;
        }

        .quick-link span {
            font-size: 0.9em;
            color: #666;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            margin-top: 30px;
            border-radius: 10px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: 700;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-top: 5px;
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 0.9em;
            border-top: 1px solid #eee;
        }

        .footer a {
            color: #667eea;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.8em;
            }

            .content {
                padding: 20px;
            }

            .calendar-day {
                border-radius: 5px;
            }

            .day-number {
                font-size: 0.9em;
            }

            .paper-count {
                font-size: 0.65em;
            }

            .stats-bar {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 AI Paper Daily</h1>
            <p>论文日历导航 | 2025 年 4 月 - 12 月</p>
        </div>

        <div class="content">
            <div class="calendar-section">
                <h2>📅 选择日期查看论文</h2>
                
                <div class="calendar-controls">
                    <button id="prevMonth" onclick="changeMonth(-1)">← 上月</button>
                    <span class="month-year" id="monthYear"></span>
                    <button id="nextMonth" onclick="changeMonth(1)">下月 →</button>
                </div>

                <div class="calendar-grid" id="calendarGrid"></div>
            </div>

            <div class="quick-links">
                <a href="OVERVIEW.md" class="quick-link">
                    <strong>📊 数据总览</strong>
                    <span>查看月度统计与趋势分析</span>
                </a>
                <a href="https://github.com/quaner2557/ai-paper-daily" class="quick-link" target="_blank">
                    <strong>🔗 GitHub 仓库</strong>
                    <span>访问项目源码</span>
                </a>
            </div>

            <div class="stats-bar">
                <div class="stat-item">
                    <div class="stat-value" id="totalDays">275</div>
                    <div class="stat-label">总天数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="totalPapers">2,957</div>
                    <div class="stat-label">总论文数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="avgPapers">10.8</div>
                    <div class="stat-label">日均论文</div>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>数据来源：arXiv API | 最后更新：<span id="lastUpdate"></span></p>
            <p><a href="OVERVIEW.md">查看详细统计报告</a></p>
        </div>
    </div>

    <script>
        // 论文数据（从 OVERVIEW.md 提取）
        const paperData = {
            "202504": { "01": 9, "02": 18, "03": 12, "04": 7, "05": 8, "06": 5, "07": 14, "08": 15, "09": 14, "10": 17, "11": 7, "12": 3, "13": 8, "14": 21, "15": 10, "16": 6, "17": 14, "18": 10, "19": 8, "20": 4, "21": 8, "22": 4, "23": 10, "24": 11, "25": 5, "26": 7, "27": 3, "28": 9, "29": 12, "30": 11 },
            "202505": { "01": 10, "02": 5, "03": 6, "04": 4, "05": 8, "06": 12, "07": 12, "08": 8, "09": 6, "10": 6, "11": 6, "12": 13, "13": 10, "14": 12, "15": 8, "16": 18, "17": 7, "18": 9, "19": 7, "20": 12, "21": 12, "22": 25, "23": 15, "24": 10, "25": 19, "26": 14, "27": 21, "28": 15, "29": 9, "30": 15, "31": 9 },
            "202506": { "01": 9, "02": 12, "03": 14, "04": 15, "05": 16, "06": 16, "07": 7, "08": 7, "09": 10, "10": 14, "11": 9, "12": 14, "13": 10, "14": 7, "15": 10, "16": 13, "17": 13, "18": 13, "19": 13, "20": 7, "21": 9, "22": 4, "23": 13, "24": 10, "25": 19, "26": 13, "27": 12, "28": 2, "29": 9, "30": 5 },
            "202507": { "01": 15, "02": 9, "03": 13, "04": 7, "05": 8, "06": 3, "07": 25, "08": 19, "09": 16, "10": 11, "11": 8, "12": 11, "13": 4, "14": 14, "15": 7, "16": 12, "17": 8, "18": 16, "19": 5, "20": 5, "21": 12, "22": 13, "23": 14, "24": 10, "25": 15, "26": 7, "27": 9, "28": 9, "29": 14, "30": 6, "31": 13 },
            "202508": { "01": 13, "02": 10, "03": 3, "04": 25, "05": 16, "06": 23, "07": 21, "08": 12, "09": 7, "10": 9, "11": 17, "12": 17, "13": 18, "14": 14, "15": 9, "16": 4, "17": 2, "18": 12, "19": 19, "20": 12, "21": 24, "22": 19, "23": 6, "24": 6, "25": 21, "26": 12, "27": 19, "28": 27, "29": 13, "30": 8, "31": 5 },
            "202509": { "01": 12, "02": 10, "03": 20, "04": 9, "05": 7, "06": 7, "07": 4, "08": 15, "09": 12, "10": 8, "11": 8, "12": 10, "13": 3, "14": 8, "15": 13, "16": 13, "17": 11, "18": 14, "19": 14, "20": 7, "21": 5, "22": 13, "23": 17, "24": 8, "25": 11, "26": 12, "27": 7, "28": 7, "29": 13, "30": 13 },
            "202510": { "01": 14, "02": 17, "03": 9, "04": 4, "05": 10, "06": 12, "07": 13, "08": 11, "09": 17, "10": 24, "11": 9, "12": 9, "13": 26, "14": 15, "15": 16, "16": 21, "17": 14, "18": 4, "19": 6, "20": 14, "21": 14, "22": 11, "23": 14, "24": 16, "25": 6, "26": 10, "27": 13, "28": 18, "29": 15, "30": 9, "31": 13 },
            "202511": { "01": 9, "02": 6, "03": 15, "04": 9, "05": 7, "06": 6, "07": 10, "08": 7, "09": 8, "10": 23, "11": 10, "12": 6, "13": 7, "14": 11, "15": 7, "16": 6, "17": 17, "18": 12, "19": 7, "20": 9, "21": 10, "22": 6, "23": 9, "24": 18, "25": 20, "26": 10, "27": 16, "28": 8, "29": 2, "30": 6 },
            "202512": { "01": 5, "02": 9, "03": 8, "04": 3, "05": 5, "06": 3, "07": 7, "08": 10, "09": 6, "10": 9, "11": 8, "12": 4, "13": 6, "14": 6, "15": 23, "16": 10, "17": 12, "18": 11, "19": 10, "20": 4, "21": 3, "22": 9, "23": 9, "24": 9, "25": 8, "26": 3, "27": 4, "28": 2, "29": 3, "30": 10, "31": 7 }
        };

        const monthNames = ["1 月", "2 月", "3 月", "4 月", "5 月", "6 月", "7 月", "8 月", "9 月", "10 月", "11 月", "12 月"];
        const dayNames = ["日", "一", "二", "三", "四", "五", "六"];

        let currentYear = 2025;
        let currentMonth = 3; // 4 月 (0-indexed)

        function getDaysInMonth(year, month) {
            return new Date(year, month + 1, 0).getDate();
        }

        function getFirstDayOfMonth(year, month) {
            return new Date(year, month, 1).getDay();
        }

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            const monthYear = document.getElementById('monthYear');
            const prevBtn = document.getElementById('prevMonth');
            const nextBtn = document.getElementById('nextMonth');

            monthYear.textContent = `${currentYear}年 ${monthNames[currentMonth]}`;

            // 禁用按钮
            prevBtn.disabled = (currentYear === 2025 && currentMonth === 3);
            nextBtn.disabled = (currentYear === 2025 && currentMonth === 11);

            grid.innerHTML = '';

            // 添加星期标题
            dayNames.forEach(day => {
                const header = document.createElement('div');
                header.className = 'calendar-day-header';
                header.textContent = day;
                grid.appendChild(header);
            });

            const daysInMonth = getDaysInMonth(currentYear, currentMonth);
            const firstDay = getFirstDayOfMonth(currentYear, currentMonth);
            const monthKey = `${currentYear}${String(currentMonth + 1).padStart(2, '0')}`;

            // 添加空白天数
            for (let i = 0; i < firstDay; i++) {
                const emptyDay = document.createElement('div');
                emptyDay.className = 'calendar-day empty';
                grid.appendChild(emptyDay);
            }

            // 添加日期
            const today = new Date();
            for (let day = 1; day <= daysInMonth; day++) {
                const dayEl = document.createElement('div');
                const dayKey = String(day).padStart(2, '0');
                const paperCount = paperData[monthKey]?.[dayKey] || 0;
                const dateStr = `${monthKey}${dayKey}`;

                dayEl.className = 'calendar-day';
                
                if (paperCount > 0) {
                    dayEl.className += ' has-papers';
                    dayEl.onclick = () => window.location.href = `${dateStr}.html`;
                }

                if (today.getFullYear() === currentYear && today.getMonth() === currentMonth && today.getDate() === day) {
                    dayEl.className += ' today';
                }

                dayEl.innerHTML = `
                    <span class="day-number">${day}</span>
                    ${paperCount > 0 ? `<span class="paper-count">${paperCount}篇</span>` : ''}
                `;

                grid.appendChild(dayEl);
            }
        }

        function changeMonth(delta) {
            currentMonth += delta;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            } else if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderCalendar();
        }

        // 初始化
        document.getElementById('lastUpdate').textContent = new Date().toLocaleDateString('zh-CN', {
            year: 'numeric',
            month: 'long',
            day: 'numeric'
        });

        renderCalendar();
    </script>
</body>
</html>
