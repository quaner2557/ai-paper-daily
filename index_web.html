<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 AI 论文相关度查找器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 14px;
        }
        
        .form-container {
            padding: 40px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-group label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .form-group label .required {
            color: #e74c3c;
        }
        
        .form-group label .hint {
            font-weight: normal;
            color: #999;
            font-size: 12px;
            margin-left: 8px;
        }
        
        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .form-control:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        textarea.form-control {
            min-height: 150px;
            resize: vertical;
            font-family: inherit;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .btn {
            display: inline-block;
            padding: 14px 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .results-container {
            padding: 40px;
            background: #f8f9fa;
            border-top: 1px solid #e0e0e0;
            display: none;
        }
        
        .results-container.show {
            display: block;
        }
        
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .results-header h2 {
            color: #333;
            font-size: 20px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 12px;
            color: #999;
        }
        
        .paper-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border-left: 4px solid #667eea;
        }
        
        .paper-card.high-relevance {
            border-left-color: #e74c3c;
        }
        
        .paper-card.medium-relevance {
            border-left-color: #f39c12;
        }
        
        .paper-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
            line-height: 1.5;
        }
        
        .paper-title a {
            color: #667eea;
            text-decoration: none;
        }
        
        .paper-title a:hover {
            text-decoration: underline;
        }
        
        .paper-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 12px;
            font-size: 13px;
        }
        
        .meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #666;
        }
        
        .score-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .score-high {
            background: #ffebee;
            color: #e74c3c;
        }
        
        .score-medium {
            background: #fff3e0;
            color: #f39c12;
        }
        
        .score-low {
            background: #e3f2fd;
            color: #2196f3;
        }
        
        .paper-abstract {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
            background: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
            margin-top: 12px;
        }
        
        .loading {
            text-align: center;
            padding: 60px 20px;
            display: none;
        }
        
        .loading.show {
            display: block;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            color: #666;
            font-size: 14px;
        }
        
        .error-message {
            background: #ffebee;
            color: #e74c3c;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 AI 论文相关度查找器</h1>
            <p>基于你的研究摘要，从精选论文库中找到最相关的论文</p>
        </div>
        
        <div class="form-container">
            <div class="error-message" id="error-message"></div>
            
            <form id="search-form">
                <div class="form-group">
                    <label>
                        🔑 API 密钥 <span class="required">*</span>
                        <span class="hint">阿里云百炼 API Key</span>
                    </label>
                    <input type="password" id="api-key" class="form-control" placeholder="sk-..." required>
                </div>
                
                <div class="form-group">
                    <label>
                        📝 研究摘要 <span class="required">*</span>
                        <span class="hint">请详细描述你的研究内容</span>
                    </label>
                    <textarea id="abstract" class="form-control" placeholder="请输入你的研究摘要..." required></textarea>
                </div>
                
                <div class="form-group">
                    <label>
                        🏷️ 关键词
                        <span class="hint">可选，用于快速筛选（逗号分隔）</span>
                    </label>
                    <input type="text" id="keywords" class="form-control" placeholder="推荐系统，深度学习，图神经网络...">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>
                            📊 粗排截断量
                            <span class="hint">初筛候选数量</span>
                        </label>
                        <input type="number" id="candidate-n" class="form-control" value="200" min="50" max="500" step="50">
                    </div>
                    
                    <div class="form-group">
                        <label>
                            🎯 精排返回量
                            <span class="hint">最终返回论文数</span>
                        </label>
                        <input type="number" id="top-k" class="form-control" value="10" min="5" max="50" step="5">
                    </div>
                </div>
                
                <button type="submit" class="btn" id="submit-btn">
                    🚀 开始查找相关论文
                </button>
            </form>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div class="loading-text" id="loading-text">正在初始化...</div>
        </div>
        
        <div class="results-container" id="results-container">
            <div class="results-header">
                <h2>📊 查找结果</h2>
                <button class="btn" onclick="window.location.reload()" style="width: auto; padding: 10px 20px; font-size: 14px;">
                    🔍 新的搜索
                </button>
            </div>
            
            <div class="stats" id="stats">
                <!-- 动态生成 -->
            </div>
            
            <div id="papers-list">
                <!-- 动态生成 -->
            </div>
        </div>
    </div>
    
    <script>
        document.getElementById('search-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // 获取表单数据
            const formData = {
                api_key: document.getElementById('api-key').value,
                abstract: document.getElementById('abstract').value,
                keywords: document.getElementById('keywords').value,
                candidate_n: parseInt(document.getElementById('candidate-n').value),
                top_k: parseInt(document.getElementById('top-k').value)
            };
            
            // 验证
            if (!formData.api_key || !formData.abstract) {
                showError('请填写 API 密钥和研究摘要');
                return;
            }
            
            // 隐藏错误，显示加载
            hideError();
            showLoading('正在准备数据...');
            
            try {
                // 调用后端 API
                const response = await fetch('/api/find-related', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message || '查找失败');
                }
                
                const result = await response.json();
                
                // 显示结果
                showResults(result);
                
            } catch (error) {
                hideLoading();
                showError(error.message);
            }
        });
        
        function showLoading(text) {
            document.getElementById('loading-text').textContent = text;
            document.getElementById('loading').classList.add('show');
            document.getElementById('submit-btn').disabled = true;
        }
        
        function hideLoading() {
            document.getElementById('loading').classList.remove('show');
            document.getElementById('submit-btn').disabled = false;
        }
        
        function showError(message) {
            const errorEl = document.getElementById('error-message');
            errorEl.textContent = '❌ ' + message;
            errorEl.classList.add('show');
        }
        
        function hideError() {
            document.getElementById('error-message').classList.remove('show');
        }
        
        function showResults(result) {
            hideLoading();
            
            // 更新统计
            const statsHtml = `
                <div class="stat-card">
                    <div class="stat-value">${result.total_papers_searched}</div>
                    <div class="stat-label">总论文数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${result.related_papers.length}</div>
                    <div class="stat-label">找到相关论文</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${result.search_time}</div>
                    <div class="stat-label">耗时 (秒)</div>
                </div>
            `;
            document.getElementById('stats').innerHTML = statsHtml;
            
            // 生成论文列表
            const papersHtml = result.related_papers.map((paper, index) => {
                const score = paper._relevance_score || 0;
                const relevanceClass = score >= 8 ? 'high-relevance' : score >= 6 ? 'medium-relevance' : '';
                const scoreClass = score >= 8 ? 'score-high' : score >= 6 ? 'score-medium' : 'score-low';
                const relevanceText = score >= 8 ? '🔥 高度相关' : score >= 6 ? '⭐ 中等相关' : '📌 低度相关';
                
                return `
                    <div class="paper-card ${relevanceClass}">
                        <div class="paper-title">
                            ${index + 1}. <a href="${paper.url}" target="_blank">${paper.title}</a>
                        </div>
                        <div class="paper-meta">
                            <span class="meta-item">
                                <span class="score-badge ${scoreClass}">${score.toFixed(1)} / 10</span>
                                <span>${relevanceText}</span>
                            </span>
                            <span class="meta-item">📅 ${paper._source_date || 'N/A'}</span>
                            <span class="meta-item">⭐ 原始评分：${paper.relevance_score || 'N/A'}</span>
                            <span class="meta-item">🏷️ ${paper.categories ? paper.categories.slice(0, 3).join(', ') : 'N/A'}</span>
                        </div>
                        <div class="paper-abstract">
                            ${paper.summary ? (paper.summary.length > 300 ? paper.summary.substring(0, 300) + '...' : paper.summary) : '无摘要'}
                        </div>
                    </div>
                `;
            }).join('');
            
            document.getElementById('papers-list').innerHTML = papersHtml;
            document.getElementById('results-container').classList.add('show');
            
            // 滚动到结果
            document.getElementById('results-container').scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
