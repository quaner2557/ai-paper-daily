name: Update Calendar Index

on:
  schedule:
    # 每天北京时间 8:00 运行 (UTC 0:00)
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: true
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Run calendar update script
      # 注意：只跑 update_calendar_index.py。它生成的是数据内嵌、
      # 点击链接为 `${monthDir}/${dateStr}.html` 的完整自包含页面。
      # 原来后面还跑 update_html_template.py，会把脚本整段覆盖成
      # 依赖 fetch、且点击链接写死为 `${dateStr}.html`（丢了月份目录）的版本，
      # 导致日历上每一天点进去都是 404。该脚本已废弃，不再调用。
      run: |
        python3 update_calendar_index.py
      
    - name: Commit and push if changed
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # 检查是否有变更
        if ! git diff --quiet; then
          git add output/index.html output/paper_data.json
          git commit -m "chore: 自动更新日历导航页面 $(date +%Y-%m-%d)"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
          echo "✅ 日历导航页面已更新"
        else
          echo "ℹ️  日历导航页面无需更新"
        fi
      continue-on-error: true
