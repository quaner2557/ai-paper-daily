<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Paper Daily - 数据统计</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 40px 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: white; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 40px; text-align: center; }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; }
        .header p { font-size: 1.1em; opacity: 0.9; }
        .content { padding: 40px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%); padding: 30px; border-radius: 15px; text-align: center; border-left: 5px solid #667eea; }
        .stat-value { font-size: 3em; font-weight: 700; color: #667eea; margin-bottom: 10px; }
        .stat-label { font-size: 1.1em; color: #666; }
        .chart-container { background: #f8f9fa; padding: 30px; border-radius: 15px; margin-bottom: 30px; }
        .chart-container h2 { color: #333; margin-bottom: 20px; text-align: center; }
        .chart-wrapper { position: relative; height: 400px; }
        .nav-links { display: flex; gap: 15px; justify-content: center; margin-bottom: 30px; }
        .nav-links a { display: inline-block; padding: 12px 25px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; text-decoration: none; border-radius: 8px; transition: transform 0.2s; }
        .nav-links a:hover { transform: translateY(-2px); }
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e1e4e8; }
        th { background: #f8f9fa; font-weight: 600; color: #333; }
        tr:hover { background: #f8f9fa; }
        .footer { text-align: center; padding: 20px; color: #666; border-top: 1px solid #eee; }
        .footer a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 AI Paper Daily - 数据统计</h1>
            <p>可视化数据看板 | 2025 年 4 月 - 2026 年 3 月</p>
        </div>

        <div class="content">
            <div class="nav-links">
                <a href="index.html">📅 返回日历</a>
                <a href="OVERVIEW.md">📄 详细报告</a>
                <a href="https://github.com/quaner2557/ai-paper-daily" target="_blank">🔗 GitHub</a>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="totalPapers">-</div>
                    <div class="stat-label">📚 总论文数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalDays">-</div>
                    <div class="stat-label">📅 总天数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="avgPapers">-</div>
                    <div class="stat-label">📈 日均论文</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="peakDay">-</div>
                    <div class="stat-label">🎯 高峰日</div>
                </div>
            </div>

            <div class="chart-container">
                <h2>📊 月度论文趋势</h2>
                <div class="chart-wrapper">
                    <canvas id="monthlyChart"></canvas>
                </div>
            </div>

            <div class="chart-container">
                <h2>📈 每日论文数量（最近 30 天）</h2>
                <div class="chart-wrapper">
                    <canvas id="dailyChart"></canvas>
                </div>
            </div>

            <div class="chart-container">
                <h2>📋 详细数据表</h2>
                <div class="table-container">
                    <table id="dataTable">
                        <thead>
                            <tr>
                                <th>月份</th>
                                <th>论文总数</th>
                                <th>天数</th>
                                <th>日均</th>
                                <th>高峰日</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>数据来源：arXiv API | 最后更新：<span id="lastUpdate"></span></p>
            <p><a href="index.html">返回首页</a> | <a href="OVERVIEW.md">查看 Markdown 报告</a></p>
        </div>
    </div>

    <script>
        let paperData = {};

        async function loadData() {
            try {
                const response = await fetch('paper_data.json');
                paperData = await response.json();
                
                calculateStats();
                renderCharts();
                renderTable();
                
                document.getElementById('lastUpdate').textContent = new Date().toLocaleDateString('zh-CN', {
                    year: 'numeric', month: 'long', day: 'numeric'
                });
            } catch (error) {
                console.error('加载数据失败:', error);
            }
        }

        function calculateStats() {
            let totalPapers = 0;
            let totalDays = 0;
            let peakCount = 0;
            let peakDate = '';

            for (const month in paperData) {
                const days = paperData[month];
                for (const day in days) {
                    const count = days[day];
                    totalPapers += count;
                    totalDays++;
                    
                    if (count > peakCount) {
                        peakCount = count;
                        peakDate = `${month}-${day}`;
                    }
                }
            }

            const avg = totalDays > 0 ? (totalPapers / totalDays).toFixed(1) : 0;

            document.getElementById('totalPapers').textContent = totalPapers.toLocaleString();
            document.getElementById('totalDays').textContent = totalDays;
            document.getElementById('avgPapers').textContent = avg;
            document.getElementById('peakDay').textContent = `${peakDate} (${peakCount}篇)`;
        }

        function renderCharts() {
            // 月度趋势图
            const monthlyCtx = document.getElementById('monthlyChart').getContext('2d');
            const monthlyLabels = Object.keys(paperData).map(m => `${m.substring(4,6)}月`);
            const monthlyData = Object.values(paperData).map(days => 
                Object.values(days).reduce((a, b) => a + b, 0)
            );

            new Chart(monthlyCtx, {
                type: 'bar',
                data: {
                    labels: monthlyLabels,
                    datasets: [{
                        label: '论文数',
                        data: monthlyData,
                        backgroundColor: 'rgba(102, 126, 234, 0.8)',
                        borderColor: 'rgba(102, 126, 234, 1)',
                        borderWidth: 2,
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,0.05)' } },
                        x: { grid: { display: false } }
                    }
                }
            });

            // 每日趋势图（最近 30 天）
            const dailyCtx = document.getElementById('dailyChart').getContext('2d');
            const allDays = [];
            
            for (const month in paperData) {
                const days = paperData[month];
                for (const day in days) {
                    allDays.push({ date: `${month}-${day}`, count: days[day] });
                }
            }
            
            allDays.sort((a, b) => a.date.localeCompare(b.date));
            const last30Days = allDays.slice(-30);

            new Chart(dailyCtx, {
                type: 'line',
                data: {
                    labels: last30Days.map(d => d.date.substring(4)),
                    datasets: [{
                        label: '论文数',
                        data: last30Days.map(d => d.count),
                        borderColor: 'rgba(118, 75, 162, 1)',
                        backgroundColor: 'rgba(118, 75, 162, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 4,
                        pointBackgroundColor: 'rgba(118, 75, 162, 1)'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,0.05)' } },
                        x: { grid: { display: false } }
                    }
                }
            });
        }

        function renderTable() {
            const tbody = document.querySelector('#dataTable tbody');
            
            for (const month in paperData) {
                const days = paperData[month];
                const total = Object.values(days).reduce((a, b) => a + b, 0);
                const dayCount = Object.keys(days).length;
                const avg = (total / dayCount).toFixed(1);
                const peakDay = Object.entries(days).sort((a, b) => b[1] - a[1])[0];
                
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${month.substring(0,4)}年${month.substring(4,6)}月</strong></td>
                    <td>${total} 篇</td>
                    <td>${dayCount} 天</td>
                    <td>${avg} 篇/天</td>
                    <td>${peakDay[0]}日 (${peakDay[1]}篇)</td>
                `;
                tbody.appendChild(tr);
            }
        }

        loadData();
    </script>
</body>
</html>
