name: AI Paper Daily

on:
  schedule:
    # 每天北京时间 7:30 运行 (UTC 23:30，前一天)
    - cron: '30 23 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式：daily(日常) 或 backfill(回刷)'
        required: false
        default: 'daily'
        type: choice
        options:
          - daily
          - backfill
      backfill_date:
        description: '回刷日期 (YYYYMMDD 格式，仅在 mode=backfill 时使用)'
        required: false
        type: string

jobs:
  daily-papers:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: true
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        
    - name: Run AI Paper Daily (Daily Mode)
      if: github.event.inputs.mode == 'daily' || github.event.inputs.mode == ''
      env:
        LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        LLM_MODEL: ${{ secrets.LLM_MODEL }}
        LLM_PRERANK_MODEL: ${{ secrets.LLM_PRERANK_MODEL }}
        LLM_FINERANK_MODEL: ${{ secrets.LLM_FINERANK_MODEL }}
        FEISHU_URL: ${{ secrets.FEISHU_URL }}
        DINGTALK_URL: ${{ secrets.DINGTALK_URL }}
        DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        ARXIV_CATEGORIES: ${{ vars.ARXIV_CATEGORIES }}
        MAX_PAPERS_FETCH: ${{ vars.MAX_PAPERS_FETCH }}
        MAX_PAPERS_OUTPUT: ${{ vars.MAX_PAPERS_OUTPUT }}
        MIN_RELEVANCE_SCORE: ${{ vars.MIN_RELEVANCE_SCORE }}
      run: |
        python main.py
    
    - name: Run AI Paper Daily (Backfill Mode)
      if: github.event.inputs.mode == 'backfill'
      env:
        LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        LLM_MODEL: ${{ secrets.LLM_MODEL }}
        LLM_PRERANK_MODEL: ${{ secrets.LLM_PRERANK_MODEL }}
        LLM_FINERANK_MODEL: ${{ secrets.LLM_FINERANK_MODEL }}
        FEISHU_URL: ${{ secrets.FEISHU_URL }}
        DINGTALK_URL: ${{ secrets.DINGTALK_URL }}
        DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        ARXIV_CATEGORIES: ${{ vars.ARXIV_CATEGORIES }}
        MAX_PAPERS_FETCH: ${{ vars.MAX_PAPERS_FETCH }}
        MAX_PAPERS_OUTPUT: ${{ vars.MAX_PAPERS_OUTPUT }}
        MIN_RELEVANCE_SCORE: ${{ vars.MIN_RELEVANCE_SCORE }}
        BACKFILL_DATE: ${{ github.event.inputs.backfill_date }}
      run: |
        if [ -z "$BACKFILL_DATE" ]; then
          echo "❌ Error: backfill_date is required for backfill mode"
          exit 1
        fi
        echo "🚀 Backfilling date: $BACKFILL_DATE"
        # 清理空文件（避免被检测为已存在）
        for date in $(seq $BACKFILL_DATE $BACKFILL_DATE); do
          rm -f output/${date}.json output/${date}.md output/${date}.html
        done
        python backfill_date.py --start $BACKFILL_DATE --end $BACKFILL_DATE
        
    - name: Verify daily files were produced
      run: |
        # main.py 内部 catch 了所有异常且失败时直接 return，进程退出码始终为 0。
        # 这里显式校验本次是否真的产出了日报文件，否则任务红一下，避免静默失败。
        shopt -s nullglob
        produced=(output/[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9].json)
        if [ ${#produced[@]} -eq 0 ]; then
          echo "::error::本次运行没有产出任何日报文件，请检查上一步日志（arXiv 抓取或 LLM 调用可能失败）"
          exit 1
        fi
        echo "✅ 本次产出 ${#produced[@]} 个日报 JSON: ${produced[*]}"

    - name: Archive daily files into month folders
      run: |
        # 日历页的链接固定指向 output/YYYYMM/YYYYMMDD.html，
        # 而生成脚本写在 output/ 根目录，不归档的话点进去会 404。
        python3 archive_daily.py

    - name: Commit and push results
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # 创建 output 目录如果不存在
        mkdir -p output
        
        # 添加输出文件
        git add output/
        
        # 检查是否有变更
        if git diff --staged --quiet; then
          echo "::error::暂存区为空，日报文件未能进入 Git。请确认 .gitignore 没有误伤 output/ 下的文件"
          exit 1
        fi
        
        git commit -m "Update AI papers $(date +%Y-%m-%d)"
        
        # 与 Update Calendar Index 工作流可能撞车，推送失败时 rebase 后重试
        for attempt in 1 2 3; do
          if git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:main; then
            echo "✅ 推送成功"
            exit 0
          fi
          echo "⚠️  推送失败，第 ${attempt} 次重试前先 rebase 远端最新提交"
          git pull --rebase "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" main
        done
        echo "::error::推送重试 3 次仍失败"
        exit 1
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ai-papers-${{ github.run_id }}
        path: output/
        retention-days: 30
